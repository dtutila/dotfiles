# Jabra Evolve2 75 via the Link 380 dongle.
#
# Prefer the Jabra as the default speaker and mic whenever the dongle is
# plugged in. WirePlumber picks the default from the user's saved choice first
# (~/.local/state/wireplumber/default-nodes); priority.session decides the
# fallback when that device is missing. Stock ALSA priorities rank the C922
# webcam mic (2109) above the Jabra mic (2100), so lift both Jabra nodes clear
# of every other device.
#
# Volume stays on the dongle's hardware control (no api.alsa.soft-mixer): it
# syncs both ways with the headset buttons, and software volume would stack a
# second attenuation on top of whatever level the hardware was left at.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(input|output)[.]usb-0b0e_Jabra_Link_380_.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]
