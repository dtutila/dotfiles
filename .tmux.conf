# Reload tmux configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -g prefix C-a
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# extended key reporting
set -g extended-keys on
set -g extended-keys-format csi-u

# focus-events and escape-time are handled by tmux-sensible.
# Keep system clipboard integration enabled for tmux/yank workflows.
set -g set-clipboard on
setw -g mode-keys vi


set -g default-terminal "tmux-256color"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',screen-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'
# Session restore is convenient but writes session metadata to disk.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'
# vim-navigator pane bindings (C-h/j/k/l/\) are provided by the plugin above.


# See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

# catppuccin
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin before status-right (required for TPM)
run ~/.tmux/plugins/tmux/catppuccin.tmux
set -gF status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @mighty-scroll-interval 3
set -g @mighty-scroll-by-line 'man fzf'
set -g @mighty-scroll-select-pane off
# Full-screen TUIs (claude, codex, lazygit, btop, k9s, …) run on the alternate
# screen with mouse tracking on and scroll their own view. Forward the wheel to
# any alt-screen app instead of hijacking it into tmux copy-mode, which is empty
# there. Normal shells (alt=0) still get copy-mode scrollback as before.
set -g @mighty-scroll-fallback-mode 'pass-through'

set -g @plugin 'tmux-plugins/tmux-yank'



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
