
# FONT
font_size 12.0
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      VictorMono Nerd Font Mono
bold_italic_font VictorMono Nerd Font Mono

# CONFIRM CLOSE
confirm_os_window_close 0

# BACKGROUND
background_opacity 0.95
include themes/noctalia.conf

# Keybindings
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter (Omarchy).
# zsh maps the same sequence back to accept-line in .zshrc.
map shift+enter send_text all \e[13;2u
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# New windows open in the current working directory (Garuda).
map ctrl+shift+n new_os_window_with_cwd

# Cursor trail (Garuda)
cursor_trail 1
cursor_trail_decay 0.15 0.5
cursor_trail_start_threshold 1
