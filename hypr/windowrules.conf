#1password
windowrule = no_screen_share on, match:class ^(1Password)$
windowrule = no_screen_share on, match:class ^(Bitwarden)$

# Floating windows
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 800 600, match:tag floating-window

windowrule = float on, match:class ^(1Password)$
windowrule = float on, match:class ^(mpv)$
windowrule = size 1280 720, match:class ^(mpv)$
# Force chromium into a tile to deal with --app bug
windowrule = tile on, match:class ^(Chromium)$
windowrule = tile on, match:class ^(google-chrome)$



# Only slight opacity when unfocused
windowrule = opacity 1 0.97, match:class ^(Chromium|chromium|google-chrome|google-chrome-unstable)$
windowrule = opacity 1 1, match:initial_title ^(youtube.com_/)$ # Youtube

# Picture-in-picture overlays
#windowrule = tag +pip, match:title (Picture.{0,1}in.{0,1}[Pp]icture)
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
windowrule = size 600 338, match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = opacity 1 1, match:tag pip
windowrule = move (monitor_w-window_w-40) (monitor_h*0.04), match:tag pip


# Float and center settings and previews
windowrule = tag +floating-window, match:class (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|Omarchy|About|TUI.float)
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule = float on, match:class org.gnome.Calculator

# Float and center file pickers
windowrule = tag +picker, match:class (xdg-desktop-portal-gtk|sublime_text)
windowrule = float on, match:tag picker, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)
windowrule = center on, match:tag picker, match:title ^(Open.*Files?|Save.*Files?|All Files|Save)
windowrule = size 800 600, match:tag picker

# Fullscreen screensaver
windowrule = fullscreen on, match:class Screensaver

# No transparency on media windows
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$



# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

windowrule = float on, match:title ^(Calculator)$

windowrule = workspace 22, match:class ^(Spotify)$
windowrule = workspace 21, match:class ^(Discord)$
# windowrule = workspace 21, match:class ^(1Password)$
windowrule = workspace 20, match:class ^(Firefox)$
# Browser types
windowrule = tag +chromium-based-browser, match:class ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable|helium)
windowrule = tag +firefox-based-browser, match:class ([fF]irefox|zen|librewolf)

# Force chromium-base browsers into a tile to deal with --app bug
windowrule = tile on, match:tag chromium-based-browser

# Only a subtle opacity change, but not for video sites
windowrule = opacity 1 0.97, match:tag chromium-based-browser
windowrule = opacity 1 0.97, match:tag firefox-based-browser

# Some video sites should never have opacity applied to them
windowrule = opacity 1.0 1.0, match:initial_title ((?i)(?:[a-z0-9-]+\.)*youtube\.com_/|app\.zoom\.us_/wc/home)

# JetBrains windows default size
windowrule = size 50% 50%, match:class (.*jetbrains.*), match:title ^$

# Fix tab dragging (tab titles are just one space)
windowrule = no_initial_focus on, match:class ^(.*jetbrains.*)$, match:title ^\\s$

# Allow dialogs (like "Send usage statistics") to be focusable and clickable
windowrule = no_focus off, match:class ^(.*jetbrains.*)$, match:title ^$
windowrule = no_initial_focus off, match:class ^(.*jetbrains.*)$, match:title ^$



