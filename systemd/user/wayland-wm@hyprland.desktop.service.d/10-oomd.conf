# Fedora's per-slice oomd defaults make the whole user manager a memory-pressure
# monitor, so Hyprland (and Noctalia, which runs in the same cgroup) could be
# chosen as the cgroup to kill. Omit the compositor from candidates. This is
# honored because the unit's cgroup and the monitored user@.service share an
# owner (see ManagedOOMPreference in systemd.resource-control(5)).
[Service]
ManagedOOMPreference=omit
