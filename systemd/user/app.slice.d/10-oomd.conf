# Apps launched with `uwsm app --` land in app.slice/app-*.scope.
# Fedora already sets ManagedOOMMemoryPressure=kill on every user slice
# (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf); this adds a
# swap-usage backstop. Only app.slice descendants are candidates for swap kills.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
